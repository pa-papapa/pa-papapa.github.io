<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロジェクト進捗マップ — pa-papapa</title>
<style>
  :root {
    --bg: #0f0f11;
    --bg2: #17171a;
    --bg3: #1e1e23;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8e6e0;
    --text2: #9a9890;
    --text3: #5a5856;
    --accent: #7F77DD;
    --today: rgba(127,119,221,0.18);

    --c-movie:  #7F77DD;
    --c-app:    #1D9E75;
    --c-stock:  #BA7517;
    --c-job:    #D85A30;
    --c-site:   #D4537E;
    --c-tool:   #3B8BD4;
    --c-learn:  #639922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    padding: 2rem 1.5rem 4rem;
  }
  .page-header {
    max-width: 900px;
    margin: 0 auto 2.5rem;
    border-bottom: .5px solid var(--border2);
    padding-bottom: 1.25rem;
  }
  .page-header h1 {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .page-header p {
    font-size: 13px;
    color: var(--text2);
    margin-top: 4px;
  }
  .kpi-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 1.75rem;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
  }
  .kpi {
    background: var(--bg2);
    border: .5px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    min-width: 110px;
  }
  .kpi .n { font-size: 20px; font-weight: 500; color: var(--text); }
  .kpi .l { font-size: 11px; color: var(--text2); margin-top: 2px; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    max-width: 900px;
    margin: 0 auto 1.5rem;
  }
  .leg { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
  .ld { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  .gantt-outer {
    max-width: 900px;
    margin: 0 auto;
    overflow-x: auto;
  }
  table.gantt {
    width: 100%;
    border-collapse: collapse;
    min-width: 660px;
  }
  .gantt thead th {
    font-size: 10px;
    font-weight: 500;
    color: var(--text3);
    text-align: center;
    padding: 4px 2px 6px;
    border-bottom: .5px solid var(--border2);
    white-space: nowrap;
    letter-spacing: .04em;
  }
  .gantt thead th.month-start {
    border-left: .5px solid var(--border2);
    color: var(--text2);
    font-size: 11px;
  }

  /* section header rows */
  .gantt tr.section-row td {
    padding: 16px 0 4px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text3);
    border-bottom: .5px solid var(--border);
    padding-left: 10px;
  }
  .gantt tr.section-row td.has-color {
    border-left: 3px solid var(--s-color);
    color: var(--s-color);
    opacity: 0.75;
  }

  /* data rows */
  .gantt tr.data-row { cursor: pointer; }
  .gantt tr.data-row td {
    border-bottom: .5px solid var(--border);
    vertical-align: middle;
  }
  .gantt tr.data-row:hover td { background: rgba(255,255,255,0.025); }

  td.row-label {
    padding: 6px 10px 6px 10px;
    min-width: 155px;
    max-width: 170px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-left: 3px solid transparent;
  }
  td.row-label .title {
    font-size: 12px;
    color: var(--text);
    font-weight: 500;
  }
  td.row-label .sub {
    font-size: 10px;
    color: var(--text3);
    margin-top: 1px;
  }

  td.cell {
    padding: 5px 1px;
    min-width: 28px;
    vertical-align: middle;
  }
  td.cell.month-start { border-left: .5px solid var(--border); }
  td.cell.today-col { background: var(--today); }

  .bar {
    height: 12px;
    border-radius: 3px;
    width: 100%;
  }
  .bar.done  { opacity: 1; }
  .bar.doing { opacity: 1; background-image: repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(255,255,255,0.12) 4px, rgba(255,255,255,0.12) 5px); }
  .bar.todo  { opacity: 0.28; }

  /* overlay */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .overlay.open { display: flex; }

  /* popup */
  .popup {
    background: var(--bg2);
    border: .5px solid var(--border2);
    border-radius: 12px;
    padding: 1.5rem;
    width: 100%;
    max-width: 520px;
    position: relative;
    animation: pop-in 0.18s ease;
  }
  @keyframes pop-in {
    from { opacity: 0; transform: scale(0.95) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .popup-close {
    position: absolute;
    top: 12px; right: 14px;
    background: none;
    border: none;
    color: var(--text3);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.15s;
  }
  .popup-close:hover { color: var(--text); }
  .d-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-right: 24px;
  }
  .d-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .d-body {
    color: var(--text2);
    line-height: 1.75;
    font-size: 13px;
  }
  .d-status {
    display: inline-block;
    margin-top: 12px;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 99px;
    font-weight: 500;
  }
  .d-status.done  { background: rgba(99,153,34,0.18);  color: #97C459; }
  .d-status.doing { background: rgba(127,119,221,0.18); color: #AFA9EC; }
  .d-status.todo  { background: rgba(90,88,86,0.25);    color: #888780; }
  .d-status.multi { background: rgba(186,117,23,0.18);  color: #FAC775; }

  .today-note {
    max-width: 900px;
    margin: 10px auto 0;
    font-size: 11px;
    color: var(--text3);
  }
  .today-note span {
    display: inline-block;
    width: 10px; height: 2px;
    background: var(--accent);
    vertical-align: middle;
    margin-right: 4px;
    opacity: 0.6;
  }
</style>
</head>

function buildGantt() {
  const table = document.getElementById('gantt');

  // thead
  const thead = table.createTHead();
  const trHead = thead.insertRow();
  const thLabel = document.createElement('th');
  thLabel.style.textAlign = 'left';
  thLabel.style.minWidth = '155px';
  trHead.appendChild(thLabel);

  MONTH_LABELS.forEach((m, mi) => {
    const n = MONTH_COLS[mi];
    for (let c = 0; c < n; c++) {
      const th = document.createElement('th');
      if (c === 0) {
        th.className = 'month-start';
        th.textContent = m;
        th.colSpan = 1;
      }
      trHead.appendChild(th);
    }
  });

  // tbody
  const tbody = table.createTBody();

  rows.forEach(row => {
    const tr = tbody.insertRow();

    if (row.type === 'section') {
      tr.className = 'section-row';
      const td = tr.insertCell();
      td.colSpan = TOTAL + 1;
      td.textContent = row.label;
      if (row.color) {
        td.classList.add('has-color');
        td.style.setProperty('--s-color', row.color);
      }
      return;
    }

    tr.className = 'data-row';
    tr.dataset.id = row.id;

    // label cell with color left-border
    const tdLabel = tr.insertCell();
    tdLabel.className = 'row-label';
    tdLabel.style.borderLeftColor = row.color;
    tdLabel.innerHTML = `<div class="title">${row.label}</div><div class="sub">${row.sub}</div>`;

    // bar map
    const map = new Array(TOTAL).fill(null);
    row.bars.forEach(b => {
      for (let c = b.s; c < b.e && c < TOTAL; c++) map[c] = b.st;
    });

    for (let c = 0; c < TOTAL; c++) {
      const td = tr.insertCell();
      td.className = 'cell';
      if (MONTH_STARTS.includes(c) && c > 0) td.classList.add('month-start');
      if (c === TODAY) td.classList.add('today-col');

      if (map[c]) {
        const bar = document.createElement('div');
        bar.className = `bar ${map[c]}`;
        bar.style.background = row.color;
        td.appendChild(bar);
      }
    }

    // click to show detail
    tr.addEventListener('click', () => showDetail(row));
  });
}

let currentId = null;

function showDetail(row) {
  const overlay = document.getElementById('overlay');
  const dotEl   = document.getElementById('d-dot');
  const titleEl = document.getElementById('d-title');
  const bodyEl  = document.getElementById('d-body');
  const statusEl= document.getElementById('d-status');

  dotEl.style.background = row.color;
  titleEl.textContent = row.label;
  bodyEl.textContent  = row.detail;

  const statusMap = {
    done:  { text: '✅ 完了',        cls: 'done' },
    doing: { text: '🔵 進行中',      cls: 'doing' },
    todo:  { text: '⬜ 予定',        cls: 'todo' },
    multi: { text: '✅ / 🔵 完了＋継続', cls: 'multi' },
  };
  const s = statusMap[row.status] || statusMap.todo;
  statusEl.textContent = s.text;
  statusEl.className   = `d-status ${s.cls}`;

  overlay.classList.add('open');
  currentId = row.id;
}

function closePopup() {
  document.getElementById('overlay').classList.remove('open');
  currentId = null;
}

document.getElementById('popup-close').addEventListener('click', closePopup);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closePopup();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });

buildGantt();
</script>
</body>
</html>
