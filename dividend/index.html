<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配当収入ダッシュボード [DEMO]</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2436;--border:#2a3050;
  --c1:#f6ad55;--c2:#4fd1c5;--c3:#f687b3;--c4:#68d391;--c5:#86efac;--c6:#fbbf24;
  --total:#a78bfa;--text:#e2e8f0;--muted:#7888a4;--dim:#4a5568;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;font-weight:300;min-height:100vh;}
nav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 24px;}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;}
.nav-logo{font-size:13px;font-weight:700;padding:14px 20px 14px 0;border-right:1px solid var(--border);margin-right:8px;white-space:nowrap;}
.nav-logo span{color:var(--total);}
.nav-tab{padding:16px 18px;font-size:12px;color:var(--muted);cursor:pointer;border:none;background:none;font-family:'Noto Sans JP',sans-serif;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{color:var(--text);border-bottom-color:var(--total);}
.filter-bar{background:var(--surface2);border-bottom:1px solid var(--border);padding:0 24px;}
.filter-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:7px 0;flex-wrap:wrap;}
.filter-label{font-size:10px;color:var(--dim);font-family:'DM Mono',monospace;margin-right:2px;white-space:nowrap;}
.fbtn{padding:4px 11px;border-radius:20px;font-size:11px;cursor:pointer;color:var(--muted);border:1px solid var(--border);background:none;font-family:'DM Mono',monospace;transition:all .2s;white-space:nowrap;}
.fbtn:hover{color:var(--text);border-color:var(--muted);}
.fbtn.active{background:var(--total);color:#fff;border-color:var(--total);}
.month-filter-row{border-top:1px solid var(--border);display:none;}
main{max-width:1200px;margin:0 auto;padding:24px 24px 80px;}
.page{display:none;}
.page.active{display:block;}
.kpi-row{display:grid;gap:12px;margin-bottom:16px;}
.cols3{grid-template-columns:repeat(3,1fr);}
.cols4{grid-template-columns:repeat(4,1fr);}
.cols5{grid-template-columns:repeat(5,1fr);}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kc,var(--total));}
.kpi-label{font-size:10px;color:var(--muted);margin-bottom:6px;font-family:'DM Mono',monospace;line-height:1.4;}
.kpi-value{font-family:'DM Mono',monospace;font-size:clamp(16px,2vw,24px);font-weight:500;line-height:1;letter-spacing:-.02em;color:var(--kc,var(--total));}
.kpi-unit{font-size:11px;opacity:.6;margin-left:2px;}
.kpi-note{margin-top:5px;font-size:10px;color:var(--dim);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px;margin-bottom:16px;}
.card-header{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.card-title{font-size:13px;font-weight:600;}
.card-sub{font-size:11px;color:var(--muted);margin-left:auto;font-family:'DM Mono',monospace;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.legend{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;}
.ldot{width:7px;height:7px;border-radius:2px;flex-shrink:0;}
.rank-list{display:flex;flex-direction:column;gap:7px;}
.ri{display:flex;align-items:center;gap:8px;}
.rn{font-size:11px;color:var(--muted);width:130px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rb-wrap{flex:1;background:var(--surface2);border-radius:3px;height:6px;overflow:hidden;}
.rb{height:100%;border-radius:3px;}
.rv{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);width:68px;text-align:right;flex-shrink:0;}
.source-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px;}
.source-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;}
.sc-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.sc-badge{font-size:10px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:4px;}
.sc-total{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;margin-bottom:8px;}
.sc-items{display:flex;flex-direction:column;gap:4px;}
.sc-item{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:3px 0;border-bottom:1px solid var(--border);}
.sc-item:last-child{border-bottom:none;}
.sc-item-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;}
.sc-item-val{font-family:'DM Mono',monospace;flex-shrink:0;margin-left:8px;}
.no-data{text-align:center;padding:32px;color:var(--dim);font-size:13px;}
.month-detail-title{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
@media(max-width:720px){.cols5{grid-template-columns:repeat(2,1fr);}.cols4{grid-template-columns:repeat(2,1fr);}.two-col{grid-template-columns:1fr;}.rn{width:90px;}}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="nav-logo">配当収入 <span>Tracker</span><span style="font-size:9px;background:#a78bfa33;color:#a78bfa;border:1px solid #a78bfa55;border-radius:4px;padding:1px 6px;margin-left:6px;font-family:'DM Mono',monospace;letter-spacing:.05em;">DEMO</span></div>
    <button class="nav-tab active" onclick="showPage('overview',this)">📊 概要</button>
    <button class="nav-tab" onclick="showPage('sbi',this)">🏦 SBI</button>
    <button class="nav-tab" onclick="showPage('rakuten',this)">📈 楽天</button>
    <button class="nav-tab" onclick="showPage('froggy',this)">🐸 フロッギー</button>
  </div>
</nav>

<div class="filter-bar">
  <div class="filter-inner">
    <span class="filter-label">年：</span>
    <button class="fbtn active" id="fy-all" onclick="setYearFilter('all',this)">全期間</button>
    <button class="fbtn" onclick="setYearFilter('2026',this)">2026</button>
    <button class="fbtn" onclick="setYearFilter('2025',this)">2025</button>
    <button class="fbtn" onclick="setYearFilter('2024',this)">2024</button>
    <button class="fbtn" onclick="setYearFilter('2023',this)">2023</button>
    <button class="fbtn" onclick="setYearFilter('2022',this)">2022</button>
    <button class="fbtn" onclick="setYearFilter('2021',this)">2021</button>
  </div>
  <div class="filter-inner month-filter-row" id="monthFilterRow">
    <span class="filter-label">月：</span>
    <button class="fbtn active" id="fm-all" onclick="setMonthFilter('all',this)">全月</button>
    <span id="monthBtns" style="display:contents"></span>
  </div>
</div>

<main>
<div style="max-width:1200px;margin:16px auto 0;padding:0 24px;">
  <div style="background:#a78bfa18;border:1px solid #a78bfa44;border-radius:8px;padding:10px 16px;font-size:11px;color:#a78bfa;font-family:'DM Mono',monospace;display:flex;align-items:center;gap:8px;">
    <span>⚠️</span>
    <span>このダッシュボードはデモ用サンプルデータです。銘柄名・金額はすべて架空であり、実際の証券口座・銘柄・金額とは一切関係ありません。</span>
  </div>
</div>

<!-- 概要ページ -->
<div id="page-overview" class="page active">
  <div id="ovKpiRow" class="kpi-row cols5"></div>
  <div class="card">
    <div class="card-header"><div class="cdot" style="background:var(--total)"></div><div class="card-title">年別収入推移（円建て）</div><div class="card-sub" id="ovYearSub"></div></div>
    <div style="position:relative;height:250px"><canvas id="ovYearChart"></canvas></div>
    <div class="legend">
      <div class="li"><div class="ldot" style="background:var(--c1)"></div>SBI 配当外</div>
      <div class="li"><div class="ldot" style="background:var(--c2)"></div>SBI 貸株中</div>
      <div class="li"><div class="ldot" style="background:var(--c3)"></div>楽天 円</div>
      <div class="li"><div class="ldot" style="background:var(--c5)"></div>フロッギー</div>
    </div>
  </div>
  <div class="card">
    <div class="card-header"><div class="cdot" style="background:var(--total)"></div><div class="card-title">月別収入推移（円建て）</div></div>
    <div style="position:relative;height:230px"><canvas id="ovMonthChart"></canvas></div>
  </div>
  <div id="ovMonthDetail"></div>
</div>

<!-- SBIページ -->
<div id="page-sbi" class="page">
  <div id="sbiKpiRow" class="kpi-row cols3"></div>
  <div class="two-col">
    <div class="card">
      <div class="card-header"><div class="cdot" style="background:var(--total)"></div><div class="card-title">年別推移</div></div>
      <div style="position:relative;height:210px"><canvas id="sbiYearChart"></canvas></div>
      <div class="legend">
        <div class="li"><div class="ldot" style="background:var(--c1)"></div>配当外</div>
        <div class="li"><div class="ldot" style="background:var(--c2)"></div>貸株中</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><div class="cdot" style="background:var(--total)"></div><div class="card-title">月別推移</div></div>
      <div style="position:relative;height:210px"><canvas id="sbiMonthChart"></canvas></div>
      <div class="legend">
        <div class="li"><div class="ldot" style="background:var(--c1)"></div>配当外</div>
        <div class="li"><div class="ldot" style="background:var(--c2)"></div>貸株中</div>
      </div>
    </div>
  </div>
  <div class="two-col">
    <div class="card"><div class="card-header"><div class="cdot" style="background:var(--c1)"></div><div class="card-title">配当（貸株外）銘柄別</div></div><div class="rank-list" id="rSbiDist"></div></div>
    <div class="card"><div class="card-header"><div class="cdot" style="background:var(--c2)"></div><div class="card-title">配当相当額（貸株中）銘柄別</div></div><div class="rank-list" id="rSbiDiv"></div></div>
  </div>
</div>

<!-- 楽天ページ -->
<div id="page-rakuten" class="page">
  <div id="rakKpiRow" class="kpi-row cols3"></div>
  <div class="two-col">
    <div class="card">
      <div class="card-header"><div class="cdot" style="background:var(--c3)"></div><div class="card-title">年別推移（円建て）</div></div>
      <div style="position:relative;height:210px"><canvas id="rakYearChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="cdot" style="background:var(--c3)"></div><div class="card-title">月別推移（円建て）</div></div>
      <div style="position:relative;height:210px"><canvas id="rakMonthChart"></canvas></div>
    </div>
  </div>
  <div class="two-col">
    <div class="card"><div class="card-header"><div class="cdot" style="background:var(--c3)"></div><div class="card-title">円建て銘柄別</div></div><div class="rank-list" id="rRakJpy"></div></div>
    <div class="card"><div class="card-header"><div class="cdot" style="background:var(--c4)"></div><div class="card-title">ドル建て銘柄別（受取$）</div></div><div class="rank-list" id="rRakUsd"></div></div>
  </div>
</div>

<!-- フロッギーページ -->
<div id="page-froggy" class="page">
  <div id="frogKpiRow" class="kpi-row cols4"></div>
  <div class="two-col">
    <div class="card">
      <div class="card-header"><div class="cdot" style="background:var(--c5)"></div><div class="card-title">年別 配当 vs ポイント投入</div></div>
      <div style="position:relative;height:210px"><canvas id="frogYearChart"></canvas></div>
      <div class="legend">
        <div class="li"><div class="ldot" style="background:var(--c5)"></div>配当金</div>
        <div class="li"><div class="ldot" style="background:var(--c6);opacity:.5"></div>ポイント投入</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><div class="cdot" style="background:var(--c5)"></div><div class="card-title">月別配当推移</div></div>
      <div style="position:relative;height:210px"><canvas id="frogMonthChart"></canvas></div>
    </div>
  </div>
  <div class="card">
    <div class="card-header"><div class="cdot" style="background:var(--c5)"></div><div class="card-title">銘柄別累計 TOP20</div><div class="card-sub">全87銘柄</div></div>
    <div class="two-col" style="margin-bottom:0"><div class="rank-list" id="rFrog1"></div><div class="rank-list" id="rFrog2"></div></div>
  </div>
</div>

</main>

// ── ユーティリティ ──────────────────────────────
const C={c1:'#f6ad55',c2:'#4fd1c5',c3:'#f687b3',c4:'#68d391',c5:'#86efac',c6:'#fbbf24',tot:'#a78bfa',grid:'#2a3050',text:'#7888a4'};
Chart.defaults.color=C.text;
Chart.defaults.font.family="'DM Mono',monospace";
Chart.defaults.font.size=11;
function sumObj(o){return Object.values(o||{}).reduce((a,b)=>a+b,0);}
function fmt(v,usd=false){return usd?`$${v.toFixed(2)}`:`¥${Math.round(v).toLocaleString()}`;}
function destroyChart(id){const el=document.getElementById(id);if(el){const c=Chart.getChart(el);if(c)c.destroy();}}
const tipBase={backgroundColor:'#1e2436',borderColor:'#2a3050',borderWidth:1,titleColor:'#e2e8f0',bodyColor:'#7888a4',padding:10};
const tipY={...tipBase,callbacks:{label:ctx=>` ${fmt(ctx.parsed.y)}`}};
function rankHTML(items,color,usd=false,maxV=null){
  const mv=maxV??Math.max(...items.map(x=>x.v),1);
  return items.filter(x=>x.v>0).map(x=>`<div class="ri"><div class="rn" title="${x.n}">${x.n}</div><div class="rb-wrap"><div class="rb" style="width:${(x.v/mv*100).toFixed(1)}%;background:${color}"></div></div><div class="rv">${fmt(x.v,usd)}</div></div>`).join('');
}

// ── フィルター状態 ──────────────────────────────
let curYear='all', curMonth='all';

function filteredMonths(){
  let m=MONTHS;
  if(curYear!=='all') m=m.filter(ym=>ym.startsWith(curYear));
  if(curMonth!=='all') m=m.filter(ym=>ym.slice(5)===curMonth);
  return m;
}
function filteredYears(){
  return curYear!=='all'?[curYear]:YEARS;
}
function filteredSum(map){return filteredMonths().reduce((s,ym)=>s+sumObj(map[ym]),0);}
function filterLabel(){
  if(curYear==='all') return '累計';
  if(curMonth==='all') return curYear+'年';
  return curYear+'年'+parseInt(curMonth)+'月';
}

function setYearFilter(year,el){
  curYear=year; curMonth='all';
  document.querySelectorAll('.filter-inner:first-child .fbtn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  const row=document.getElementById('monthFilterRow');
  const btns=document.getElementById('monthBtns');
  document.getElementById('fm-all').classList.add('active');
  if(year==='all'){
    row.style.display='none';
  } else {
    const mons=MONTHS.filter(ym=>ym.startsWith(year)&&(sumObj(SBI_DIST_M[ym])+sumObj(SBI_DIV_M[ym])+sumObj(RAK_JPY_M[ym])+sumObj(FROG_DIV_M[ym]))>0);
    btns.innerHTML=mons.map(ym=>`<button class="fbtn" onclick="setMonthFilter('${ym.slice(5)}',this)">${parseInt(ym.slice(5))}月</button>`).join('');
    row.style.display='flex';
  }
  refreshAll();
}

function setMonthFilter(month,el){
  curMonth=month;
  document.querySelectorAll('#monthFilterRow .fbtn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  refreshAll();
}

let chartsInited={};
function refreshAll(){
  ['ovYearChart','ovMonthChart','sbiYearChart','sbiMonthChart','rakYearChart','rakMonthChart','frogYearChart','frogMonthChart'].forEach(destroyChart);
  Object.keys(chartsInited).forEach(k=>chartsInited[k]=false);
  const active=document.querySelector('.page.active');
  if(active){const name=active.id.replace('page-','');initPage(name);chartsInited[name]=true;}
}

// ── ページ切替 ──────────────────────────────────
function showPage(name,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  el.classList.add('active');
  if(!chartsInited[name]){initPage(name);chartsInited[name]=true;}
}
function initPage(name){
  if(name==='overview') initOverview();
  else if(name==='sbi') initSbi();
  else if(name==='rakuten') initRakuten();
  else if(name==='froggy') initFroggy();
}

// ── KPI更新 ────────────────────────────────────
function updateKpis(){
  const s1=filteredSum(SBI_DIST_M),s2=filteredSum(SBI_DIV_M);
  const r1=filteredSum(RAK_JPY_M),r2=filteredSum(RAK_USD_M);
  const f1=filteredSum(FROG_DIV_M);
  const fp=filteredMonths().reduce((s,ym)=>s+(FROG_PT_M[ym]||0),0);
  const tot=s1+s2+r1+f1;
  const lbl=filterLabel();

  const ov=document.getElementById('ovKpiRow');
  if(ov) ov.innerHTML=`
    <div class="kpi" style="--kc:var(--c1)"><div class="kpi-label">SBI 配当（貸株外）${lbl}</div><div class="kpi-value">¥${s1.toLocaleString()}</div></div>
    <div class="kpi" style="--kc:var(--c2)"><div class="kpi-label">SBI 配当相当額（貸株中）${lbl}</div><div class="kpi-value">¥${s2.toLocaleString()}</div></div>
    <div class="kpi" style="--kc:var(--c3)"><div class="kpi-label">楽天 配当（円）${lbl}</div><div class="kpi-value">¥${r1.toLocaleString()}</div></div>
    <div class="kpi" style="--kc:var(--c5)"><div class="kpi-label">フロッギー 配当${lbl}</div><div class="kpi-value">¥${f1.toLocaleString()}</div></div>
    <div class="kpi" style="--kc:var(--total)"><div class="kpi-label">円建て合計 ${lbl}</div><div class="kpi-value">¥${tot.toLocaleString()}</div><div class="kpi-note">+ $${r2.toFixed(2)}（楽天ドル）</div></div>`;

  const sb=document.getElementById('sbiKpiRow');
  if(sb) sb.innerHTML=`
    <div class="kpi" style="--kc:var(--c1)"><div class="kpi-label">配当金（貸株外）${lbl}</div><div class="kpi-value">¥${s1.toLocaleString()}</div></div>
    <div class="kpi" style="--kc:var(--c2)"><div class="kpi-label">配当金相当額（貸株中）${lbl}</div><div class="kpi-value">¥${s2.toLocaleString()}</div></div>
    <div class="kpi" style="--kc:var(--total)"><div class="kpi-label">SBI合計 ${lbl}</div><div class="kpi-value">¥${(s1+s2).toLocaleString()}</div></div>`;

  const rk=document.getElementById('rakKpiRow');
  if(rk) rk.innerHTML=`
    <div class="kpi" style="--kc:var(--c3)"><div class="kpi-label">配当金（円建て）${lbl}</div><div class="kpi-value">¥${r1.toLocaleString()}</div></div>
    <div class="kpi" style="--kc:var(--c4)"><div class="kpi-label">配当金（ドル建て）${lbl}</div><div class="kpi-value">$${r2.toFixed(2)}</div></div>
    <div class="kpi" style="--kc:var(--c3)"><div class="kpi-label">NISA口座中心</div><div class="kpi-value" style="font-size:16px">成長投資枠</div></div>`;

  const fg=document.getElementById('frogKpiRow');
  if(fg){
    const yld=fp>0?(f1/fp*100).toFixed(1):'—';
    fg.innerHTML=`
    <div class="kpi" style="--kc:var(--c5)"><div class="kpi-label">🐸 配当金 ${lbl}</div><div class="kpi-value">¥${f1.toLocaleString()}</div></div>
    <div class="kpi" style="--kc:var(--c6)"><div class="kpi-label">投入ポイント ${lbl}</div><div class="kpi-value">${fp.toLocaleString()}<span class="kpi-unit">pt</span></div></div>
    <div class="kpi" style="--kc:#94a3b8"><div class="kpi-label">配当利回り（${lbl}）</div><div class="kpi-value">${yld}<span class="kpi-unit">%</span></div></div>
    <div class="kpi" style="--kc:#c084fc"><div class="kpi-label">保有銘柄数</div><div class="kpi-value">87<span class="kpi-unit">銘柄</span></div></div>`;
  }
}

// ── 月別明細（1ヶ月選択時のみ概要に表示） ──────
function renderMonthDetail(){
  const el=document.getElementById('ovMonthDetail');
  if(!el) return;
  const mons=filteredMonths();
  if(mons.length!==1){el.innerHTML='';return;}
  const ym=mons[0];
  const srcs=[
    {label:'SBI 配当（貸株外）',data:SBI_DIST_M[ym],color:C.c1,badge:'SBI'},
    {label:'SBI 配当相当額（貸株中）',data:SBI_DIV_M[ym],color:C.c2,badge:'SBI'},
    {label:'楽天 配当（円）',data:RAK_JPY_M[ym],color:C.c3,badge:'楽天'},
    {label:'楽天 配当（ドル）',data:RAK_USD_M[ym],color:C.c4,badge:'楽天',usd:true},
    {label:'フロッギー 配当',data:FROG_DIV_M[ym],color:C.c5,badge:'🐸'},
  ];
  let html=`<div class="month-detail-title">📋 ${ym} 銘柄別明細</div><div class="source-cards">`;
  srcs.forEach(src=>{
    const items=Object.entries(src.data||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    if(!items.length) return;
    const tot=items.reduce((a,[,v])=>a+v,0);
    html+=`<div class="source-card">
      <div class="sc-header"><span class="sc-badge" style="background:${src.color}22;color:${src.color};border:1px solid ${src.color}44">${src.badge}</span><span style="font-size:11px;color:var(--muted)">${src.label}</span></div>
      <div class="sc-total" style="color:${src.color}">${fmt(tot,src.usd||false)}</div>
      <div class="sc-items">${items.map(([n,v])=>`<div class="sc-item"><span class="sc-item-name" title="${n}">${n}</span><span class="sc-item-val" style="color:${src.color}">${fmt(v,src.usd||false)}</span></div>`).join('')}</div>
    </div>`;
  });
  el.innerHTML=html+'</div>';
}

// ── 概要 ────────────────────────────────────────
function initOverview(){
  updateKpis();
  renderMonthDetail();
  const yrs=filteredYears();
  const mons=filteredMonths();
  document.getElementById('ovYearSub').textContent=curYear==='all'?'2021–2026':curYear+'年';

  // 年別（1年選択時は月別のみ表示、年別は非表示）
  const yearCard=document.querySelector('#page-overview .card:nth-child(2)');
  if(yrs.length<=1 && curYear!=='all'){
    yearCard.style.display='none';
  } else {
    yearCard.style.display='';
    destroyChart('ovYearChart');
    new Chart(document.getElementById('ovYearChart'),{
      type:'bar',data:{labels:yrs,datasets:[
        {label:'SBI 配当外',data:yrs.map(y=>YEAR_DATA[y].sbi_dist),backgroundColor:C.c1+'cc',borderRadius:3,borderSkipped:false},
        {label:'SBI 貸株中',data:yrs.map(y=>YEAR_DATA[y].sbi_div),backgroundColor:C.c2+'cc',borderRadius:3,borderSkipped:false},
        {label:'楽天 円',data:yrs.map(y=>YEAR_DATA[y].rak_jpy),backgroundColor:C.c3+'cc',borderRadius:3,borderSkipped:false},
        {label:'フロッギー',data:yrs.map(y=>YEAR_DATA[y].frog_div),backgroundColor:C.c5+'cc',borderRadius:3,borderSkipped:false},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tipY},
        scales:{x:{stacked:true,grid:{color:C.grid}},y:{stacked:true,grid:{color:C.grid},ticks:{callback:v=>'¥'+(v/1000).toFixed(0)+'k'}}}}
    });
  }

  // 月別
  const totals=mons.map(ym=>sumObj(SBI_DIST_M[ym])+sumObj(SBI_DIV_M[ym])+sumObj(RAK_JPY_M[ym])+sumObj(FROG_DIV_M[ym]));
  const combinedTip={...tipBase,callbacks:{
    title:i=>i[0].label,
    afterBody:i=>{
      const idx=i[0].dataIndex; const ym=mons[idx];
      const lines=[];
      const s1=Object.entries(SBI_DIST_M[ym]||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
      const s2=Object.entries(SBI_DIV_M[ym]||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
      const r1=Object.entries(RAK_JPY_M[ym]||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
      const f1=Object.entries(FROG_DIV_M[ym]||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
      if(s1.length)lines.push('SBI配当外',...s1.map(([n,v])=>`  ${n} ¥${v.toLocaleString()}`));
      if(s2.length)lines.push('SBI貸株中',...s2.map(([n,v])=>`  ${n} ¥${v.toLocaleString()}`));
      if(r1.length)lines.push('楽天円',...r1.map(([n,v])=>`  ${n} ¥${v.toLocaleString()}`));
      if(f1.length)lines.push('フロッギー',...f1.slice(0,5).map(([n,v])=>`  ${n} ¥${v.toLocaleString()}`));
      lines.push(`合計 ¥${totals[idx].toLocaleString()}`);
      return lines;
    },label:()=>null
  }};
  destroyChart('ovMonthChart');
  new Chart(document.getElementById('ovMonthChart'),{
    type:'bar',data:{labels:mons,datasets:[{label:'月別合計',data:totals,backgroundColor:C.tot+'99',borderRadius:2,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:combinedTip},
      scales:{x:{grid:{color:C.grid},ticks:{maxTicksLimit:12,maxRotation:45}},y:{grid:{color:C.grid},ticks:{callback:v=>'¥'+(v/1000).toFixed(0)+'k'}}}}
  });
}

// ── SBI ─────────────────────────────────────────
function initSbi(){
  updateKpis();
  const yrs=filteredYears(); const mons=filteredMonths();
  destroyChart('sbiYearChart');
  new Chart(document.getElementById('sbiYearChart'),{
    type:'bar',data:{labels:yrs,datasets:[
      {label:'配当外',data:yrs.map(y=>YEAR_DATA[y].sbi_dist),backgroundColor:C.c1+'cc',borderRadius:3,borderSkipped:false},
      {label:'貸株中',data:yrs.map(y=>YEAR_DATA[y].sbi_div),backgroundColor:C.c2+'cc',borderRadius:3,borderSkipped:false},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tipY},
      scales:{x:{stacked:true,grid:{color:C.grid}},y:{stacked:true,grid:{color:C.grid},ticks:{callback:v=>'¥'+(v/1000).toFixed(0)+'k'}}}}
  });
  destroyChart('sbiMonthChart');
  new Chart(document.getElementById('sbiMonthChart'),{
    type:'bar',data:{labels:mons,datasets:[
      {label:'配当外',data:mons.map(ym=>sumObj(SBI_DIST_M[ym])),backgroundColor:C.c1+'cc',borderRadius:2,borderSkipped:false},
      {label:'貸株中',data:mons.map(ym=>sumObj(SBI_DIV_M[ym])),backgroundColor:C.c2+'cc',borderRadius:2,borderSkipped:false},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tipY},
      scales:{x:{stacked:true,grid:{color:C.grid},ticks:{maxTicksLimit:12,maxRotation:45}},y:{stacked:true,grid:{color:C.grid},ticks:{callback:v=>'¥'+(v/1000).toFixed(0)+'k'}}}}
  });
  // 銘柄ランキング（フィルター対応）
  function filteredRank(monthMap){
    const t={};
    filteredMonths().forEach(ym=>Object.entries(monthMap[ym]||{}).forEach(([n,v])=>{t[n]=(t[n]||0)+v;}));
    return Object.entries(t).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);
  }
  document.getElementById('rSbiDist').innerHTML=rankHTML(filteredRank(SBI_DIST_M),C.c1);
  document.getElementById('rSbiDiv').innerHTML=rankHTML(filteredRank(SBI_DIV_M),C.c2);
}

// ── 楽天 ─────────────────────────────────────────
function initRakuten(){
  updateKpis();
  const yrs=filteredYears(); const mons=filteredMonths();
  destroyChart('rakYearChart');
  new Chart(document.getElementById('rakYearChart'),{
    type:'bar',data:{labels:yrs,datasets:[
      {label:'円',data:yrs.map(y=>YEAR_DATA[y].rak_jpy),backgroundColor:C.c3+'cc',borderRadius:3,borderSkipped:false},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tipY},
      scales:{x:{grid:{color:C.grid}},y:{grid:{color:C.grid},ticks:{callback:v=>'¥'+(v/1000).toFixed(0)+'k'}}}}
  });
  destroyChart('rakMonthChart');
  new Chart(document.getElementById('rakMonthChart'),{
    type:'bar',data:{labels:mons,datasets:[
      {label:'円',data:mons.map(ym=>sumObj(RAK_JPY_M[ym])),backgroundColor:C.c3+'cc',borderRadius:2,borderSkipped:false},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tipY},
      scales:{x:{grid:{color:C.grid},ticks:{maxTicksLimit:12,maxRotation:45}},y:{grid:{color:C.grid},ticks:{callback:v=>'¥'+v}}}}
  });
  function filteredRank(monthMap,usd=false){
    const t={};
    filteredMonths().forEach(ym=>Object.entries(monthMap[ym]||{}).forEach(([n,v])=>{t[n]=(t[n]||0)+v;}));
    return Object.entries(t).map(([n,v])=>({n,v:usd?Math.round(v*100)/100:Math.round(v)})).sort((a,b)=>b.v-a.v);
  }
  document.getElementById('rRakJpy').innerHTML=rankHTML(filteredRank(RAK_JPY_M),C.c3);
  document.getElementById('rRakUsd').innerHTML=rankHTML(filteredRank(RAK_USD_M,true),C.c4,true);

// ── フロッギー ───────────────────────────────────
function initFroggy(){
  updateKpis();
  const yrs=filteredYears().filter(y=>y!=='2021');
  const mons=filteredMonths();
  destroyChart('frogYearChart');
  if(yrs.length>0){
    new Chart(document.getElementById('frogYearChart'),{
      type:'bar',data:{labels:yrs,datasets:[
        {label:'ポイント投入',data:yrs.map(y=>YEAR_DATA[y].frog_pt),backgroundColor:C.c6+'33',borderColor:C.c6,borderWidth:1,borderRadius:3,borderSkipped:false},
        {label:'配当',data:yrs.map(y=>YEAR_DATA[y].frog_div),backgroundColor:C.c5+'cc',borderRadius:3,borderSkipped:false},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tipY},
        scales:{x:{grid:{color:C.grid}},y:{grid:{color:C.grid},ticks:{callback:v=>'¥'+(v/1000).toFixed(0)+'k'}}}}
    });
  }
  destroyChart('frogMonthChart');
  new Chart(document.getElementById('frogMonthChart'),{
    type:'bar',data:{labels:mons,datasets:[
      {label:'配当',data:mons.map(ym=>sumObj(FROG_DIV_M[ym])),backgroundColor:C.c5+'cc',borderRadius:2,borderSkipped:false},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tipY},
      scales:{x:{grid:{color:C.grid},ticks:{maxTicksLimit:12,maxRotation:45}},y:{grid:{color:C.grid},ticks:{callback:v=>'¥'+v}}}}
  });
  // 銘柄ランキング（フィルター対応）
  const t={};
  filteredMonths().forEach(ym=>Object.entries(FROG_DIV_M[ym]||{}).forEach(([n,v])=>{t[n]=(t[n]||0)+v;}));
  const ranked=Object.entries(t).map(([n,v])=>({n,v:Math.round(v)})).sort((a,b)=>b.v-a.v).slice(0,20);
  const mv=ranked[0]?.v??1;
  const half=Math.ceil(ranked.length/2);
  document.getElementById('rFrog1').innerHTML=rankHTML(ranked.slice(0,half),C.c5,false,mv);
  document.getElementById('rFrog2').innerHTML=rankHTML(ranked.slice(half),C.c5,false,mv);
}

// ── 起動 ────────────────────────────────────────
initPage('overview');
chartsInited['overview']=true;
</script>
